# Baut die App und veroeffentlicht sie auf GitHub Pages.
#
# Laeuft bei jedem Push auf main - und wird ausserdem vom Sammel-Workflow
# aufgerufen (workflow_call), denn: Commits, die eine Action mit dem
# GITHUB_TOKEN macht, loesen absichtlich keine weiteren Workflows aus.
# Ohne den direkten Aufruf kaeme die neue Messzeile nie auf die Seite.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; ein neuerer Stand verdraengt einen laufenden.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bauen
        run: npm run build
        env:
          # Projektseite liegt unter https://<konto>.github.io/zoa-app/
          BASE_PATH: /zoa-app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
